all: false
formatter: goimports
log-level: info
template: testify
packages:
  github.com/vo1dFl0w/auth-service/internal/repository:
    interfaces:
      AuthRepository:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "AuthRepositoryMock"
          filename: "auth_repository_mock.go"
      TokenRepository:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "TokenRepositoryMock"
          filename: "token_repository_mock.go"
  github.com/vo1dFl0w/auth-service/internal/usecase:
    interfaces:
      AuthService:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "AuthServiceMock"
          filename: "auth_service_mock.go"
      TokenService:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "TokenServiceMock"
          filename: "token_service_mock.go"
      OAuthService:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "OAuthServiceMock"
          filename: "oauth_service_mock.go"
  github.com/vo1dFl0w/auth-service/pkg/logger:
    interfaces:
      Logger:
        config:
          dir: "internal/test/mocks"
          pkgname: "mocks"
          structname: "LoggerMock"
          filename: "logger_mock.go"